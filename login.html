<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여정 레이더 · 로그인</title><style>:root{font-family:system-ui,sans-serif;color:#183d44;background:#f1f6f6}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:25px}.shell{width:100%;max-width:430px}.brand{text-align:center;margin-bottom:27px}.brand small{color:#69868a;letter-spacing:3px}.brand h1{font-size:28px;margin:10px}form{background:white;border:1px solid #dce6e8;border-radius:20px;padding:32px;box-shadow:0 15px 45px #123e480a}h2{font-size:22px;margin:0 0 10px}.muted{font-size:14px;color:#73888d;line-height:1.7}label{display:block;font-size:14px;margin:20px 0}input{width:100%;font:inherit;border:1px solid #c6d6d9;border-radius:9px;padding:13px;margin-top:8px}button{width:100%;background:#17646d;color:white;border:0;border-radius:9px;padding:14px;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.5}#error{color:#a63d29;line-height:1.6;font-size:14px}.foot{text-align:center;font-size:12px;color:#799095;line-height:1.7;margin-top:20px}[hidden]{display:none}body{background:linear-gradient(90deg,#062a5fc9,#06244966),url('/assets/tokyo.jpg') center/cover fixed}.shell{max-width:1050px;display:grid;grid-template-columns:1fr 420px;gap:0 70px;align-items:center}.brand{grid-column:1;grid-row:1/3;text-align:left;color:white}.brand small{color:#d0e1ff}.brand h1{font-size:31px}.brand:after{content:'여행의 시작,\A좋은 가격을 만나는 순간.';white-space:pre-line;display:block;font-size:38px;line-height:1.4;font-weight:700;letter-spacing:-1.5px;margin:40px 0}.brand:before{content:'✈';display:block;font-size:45px;margin-bottom:25px}form{grid-column:2;grid-row:1;border:0;box-shadow:0 20px 80px #001f493b}button{background:#2469ed}.foot{grid-column:2;grid-row:2;color:#dbe6fa}.muted{color:#7386a2}input:focus{outline:2px solid #c1d9ff;border-color:#5a8ee5}@media(max-width:800px){.shell{display:block;max-width:430px}.brand{text-align:center}.brand:after{font-size:24px;margin:15px 0}.brand:before{display:none}.brand h1{font-size:25px}body{padding:25px 18px}.brand small{font-size:10px}} :root{word-break:keep-all}</style>
<div class="shell"><div class="brand"><small>MY FLIGHT WATCH</small><h1>여정 레이더</h1></div><form id="auth-form"><h2 id="title">로그인</h2><p class="muted" id="description"></p><label>아이디<input name="username" autocomplete="username" minlength="3" maxlength="64" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" maxlength="128" required></label><label id="confirm-label" hidden>비밀번호 확인<input name="passwordConfirm" type="password" autocomplete="new-password" maxlength="128"></label><p id="error" role="alert"></p><button id="submit">로그인</button></form><p class="foot">이 홈페이지 전용 계정입니다. 항공권 사이트 계정과 별개이며,<br>계정은 이 PC에 저장됩니다.</p></div>
<script>const setup=__SETUP__,csrf='__BOOT_TOKEN__';const form=document.querySelector('#auth-form');if(setup){document.querySelector('#title').textContent='처음 오셨나요?';document.querySelector('#description').textContent='이 PC에서 사용할 아이디와 12자 이상의 비밀번호를 직접 만들어주세요. 계정은 하나만 생성됩니다.';document.querySelector('#confirm-label').hidden=false;form.elements.passwordConfirm.required=true;form.elements.password.minLength=12;form.elements.password.autocomplete='new-password';document.querySelector('#submit').textContent='계정 만들고 시작';}else document.querySelector('#description').textContent='로그인하면 저장한 항공권 조건과 알림을 볼 수 있습니다.';
form.onsubmit=async e=>{e.preventDefault();const button=document.querySelector('#submit');button.disabled=true;document.querySelector('#error').textContent='';try{const data=Object.fromEntries(new FormData(form));const response=await fetch(setup?'/api/auth/setup':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Token':csrf},body:JSON.stringify(data)});data.password='';data.passwordConfirm='';const result=await response.json();if(!response.ok)throw Error(result.error);form.reset();location.replace('/');}catch(e){document.querySelector('#error').textContent=e.message;form.elements.password.value='';form.elements.passwordConfirm.value='';}finally{button.disabled=false;}};</script></html>
